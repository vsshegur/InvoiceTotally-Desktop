<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vipul Workplace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232fb58b'/><text x='16' y='22' font-size='16' font-family='Arial' font-weight='900' text-anchor='middle' fill='%23062018'>VW</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="loadbar"></div>
  <div id="app"><div class="boot"><span class="spin"></span> Loading…</div></div>
  <script src="/ui.js"></script>
  <script src="/xls.js"></script>
  <script src="/ingest.js"></script>
  <script src="/control-center.js"></script>
  <script src="/gstr2b-purchase.js"></script>
  <script src="/gst-tools.js"></script>
  <script src="/gst-workplace.js"></script>
  <script src="/accounting-workplace.js"></script>
  <script src="/bank-steps.js"></script>
  <script src="/outstanding.js"></script>
  <script src="/app.js"></script>
  <script src="/ecommerce.js"></script>
  <script src="/bank.js"></script>
  <script src="/gst.js"></script>
  <script>
    // An early browser-script error must never leave the user staring at "Loading…" forever.
    window.addEventListener("load", () => {
      setTimeout(() => {
        const root = document.getElementById("app");
        if(root && root.querySelector(".boot")){
          root.innerHTML = '<div class="page" style="max-width:680px;margin:48px auto">'+
            '<h2>Vipul Workplace could not finish loading</h2>'+
            '<p>The interface did not initialize. The app has not submitted any new Tally entry from this page.</p>'+
            '<p>Close the window and reopen Vipul Workplace from its desktop icon. If it repeats, inspect the Startup Diagnostics or logs in LocalAppData/InvoiceTotally/logs.</p>'+
            '<button class="btn" onclick="location.reload()">Retry loading</button></div>';
        }
      },12000);
    });
  </script>
</body>
</html>
